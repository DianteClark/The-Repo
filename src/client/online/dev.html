<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Tidefall · online dev harness</title>
  <link rel="stylesheet" href="../../../styles.css">
  <script type="importmap">
    { "imports": { "three": "https://unpkg.com/three@0.170.0/build/three.module.js", "three/addons/": "https://unpkg.com/three@0.170.0/examples/jsm/" } }
  </script>
  <style>
    html, body { touch-action: auto; }
    #onlineRoot { position: fixed; inset: 0; overflow: auto; z-index: 5; background: rgba(11,23,28,.92); }
    #onlineRoot:empty { display: none; }
    #devHud { position: fixed; left: 8px; right: 8px; bottom: 8px; z-index: 4; display: flex; gap: 6px; flex-wrap: wrap; align-items: center;
      background: rgba(12,28,34,.85); border: 1px solid rgba(160,220,215,.2); border-radius: 12px; padding: 8px; font: 13px system-ui; }
    #devHud button { padding: 8px 10px; border-radius: 8px; border: 1px solid rgba(160,220,215,.3); background: #14303a; color: #e9e5d8; }
    #devHud .on { background: #ffb000; color: #111; }
    #devInfo { flex: 1 1 100%; color: #8fa5a2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #devLog { position: fixed; top: 8px; right: 8px; width: 300px; max-height: 40vh; overflow: auto; z-index: 4; font: 11px/1.3 monospace; color: #9cc; background: rgba(0,0,0,.45); padding: 6px; border-radius: 8px; }
  </style>
</head>
<body>
  <canvas id="scene"></canvas>
  <div id="devHud" class="hidden">
    <div id="devInfo">…</div>
    <button data-a="move">Move</button><button data-a="shoot">Shoot</button><button data-a="ow">Overwatch</button><button data-a="end">End turn</button>
    <button data-a="s1">1×</button><button data-a="s2">2×</button><button data-a="s4">4×</button><button data-a="ff">Skip</button><button data-a="leave">Leave</button>
  </div>
  <div id="devLog"></div>
  <div id="onlineRoot"></div>
  <script type="module" src="./dev.js"></script>
</body>
</html>
